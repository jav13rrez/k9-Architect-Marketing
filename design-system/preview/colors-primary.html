<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f1012; font-family: var(--font-body); padding: 20px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .swatch {
    display: flex; flex-direction: column; gap: 6px;
    width: 80px;
  }
  .color-block {
    height: 56px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .label { font: var(--data-xs); color: #909399; }
  .hex   { font: var(--data-xs); color: #636670; }
  .section-label {
    font: var(--label-xs); color: #636670; letter-spacing: 0.1em;
    text-transform: uppercase; margin-bottom: 12px; margin-top: 4px;
  }
</style>
</head>
<body>
<div class="section-label">Red — Primary Brand</div>
<div class="row">
  <div class="swatch">
    <div class="color-block" style="background:#fef2f2"></div>
    <span class="label">red-50</span>
    <span class="hex">#fef2f2</span>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#fecaca"></div>
    <span class="label">red-200</span>
    <span class="hex">#fecaca</span>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#f87171"></div>
    <span class="label">red-400</span>
    <span class="hex">#f87171</span>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#ef4444; box-shadow: 0 0 0 2px #ef4444, 0 0 0 4px rgba(239,68,68,0.3)"></div>
    <span class="label" style="color:#ef4444">red-500 ★</span>
    <span class="hex">#ef4444</span>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#dc2626"></div>
    <span class="label">red-600</span>
    <span class="hex">#dc2626</span>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#b91c1c"></div>
    <span class="label">red-700</span>
    <span class="hex">#b91c1c</span>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#7f1d1d"></div>
    <span class="label">red-900</span>
    <span class="hex">#7f1d1d</span>
  </div>
</div>
</body>
</html>
