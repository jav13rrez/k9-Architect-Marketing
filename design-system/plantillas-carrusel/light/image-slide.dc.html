<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../image-slot.js"></script>
<style>
body{margin:0;}
a{color:#ef4444;text-decoration:none;}
a:hover{color:#dc2626;text-decoration:underline;}
</style>
</helmet>
<div style="width:1080px;height:1440px;background:#f3f4f6;color:#111827;font-family:'Space Grotesk',sans-serif;position:relative;display:flex;flex-direction:column;overflow:hidden;">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:56px 64px 0 64px;">
    <svg width="150" height="30" viewBox="0 0 240 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(4,4)">
        <ellipse cx="20" cy="28" rx="8" ry="9" fill="#ef4444"></ellipse>
        <ellipse cx="10" cy="18" rx="4" ry="5" fill="#ef4444"></ellipse>
        <ellipse cx="18" cy="14" rx="4" ry="5" fill="#ef4444"></ellipse>
        <ellipse cx="26" cy="14" rx="4" ry="5" fill="#ef4444"></ellipse>
        <ellipse cx="34" cy="18" rx="4" ry="5" fill="#ef4444"></ellipse>
        <ellipse cx="20" cy="28" rx="5" ry="6" fill="#dc2626" opacity="0.5"></ellipse>
      </g>
      <text x="52" y="30" font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="18" fill="#111827" letter-spacing="-0.3">K9</text>
      <text x="76" y="30" font-family="'Space Grotesk',sans-serif" font-weight="400" font-size="18" fill="#9ca3af" letter-spacing="-0.3"> Behavioral</text>
      <text x="52" y="44" font-family="'JetBrains Mono',monospace" font-weight="500" font-size="11" fill="#ef4444" letter-spacing="1.5">ARCHITECT</text>
    </svg>
    <div style="display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:9999px;background:rgba(107,114,128,0.08);border:1px solid #e2e3e4;">
      <span style="width:5px;height:5px;border-radius:50%;background:#9ca3af;display:inline-block;"></span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:#4b5563;">Case File</span>
    </div>
  </div>
  <div style="flex:1;padding:32px 64px 32px 64px;display:flex;flex-direction:column;gap:20px;min-height:0;">
    <div style="flex:1;position:relative;border-radius:8px;overflow:hidden;border:1px solid #e2e3e4;min-height:0;">
      <image-slot id="image-slide-light-photo" shape="rect" placeholder="Drop a session photo" style="width:100%;height:100%;"></image-slot>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span style="font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#ef4444;">Case File 014</span>
      <span style="font-size:18px;color:#4b5563;">Muzzle conditioning, week 3</span>
    </div>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;padding:32px 64px 56px 64px;border-top:1px solid #e2e3e4;">
    <span style="font-family:'JetBrains Mono',monospace;font-size:14px;color:#9ca3af;letter-spacing:0.02em;">@K9Architect</span>
    <span style="font-family:'JetBrains Mono',monospace;font-size:14px;color:#9ca3af;letter-spacing:0.02em;">02 / 09</span>
  </div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1440}}"></script>
